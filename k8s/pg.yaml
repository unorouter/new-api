apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: newapi-pg-store
  namespace: databases
  annotations:
    # deleting this breaks WAL archiving and PITR for a live cluster; never prune it
    argocd.argoproj.io/sync-options: Prune=false
spec:
  # Without this nothing is ever deleted: every daily base backup and every WAL segment is kept
  # forever. Base backups also grow with the DB, so unbounded retention compounds rather than
  # accumulating linearly.
  retentionPolicy: 30d
  # serverName is set via plugin parameters on the Cluster, NOT here (plugin API).
  configuration:
    destinationPath: s3://unorouter-pg-backups/
    endpointURL: https://fsn1.your-objectstorage.com
    s3Credentials:
      accessKeyId:
        name: newapi-pg-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: newapi-pg-s3
        key: ACCESS_SECRET_KEY
      # Hetzner Ceph requires region or throws LocationConstraintConflict on writes.
      region:
        name: newapi-pg-s3
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
      # -vv: at default WARNING level a healthy 15-min 1GB upload is silent and
      # indistinguishable from a hang. Debug shows per-part progress.
      additionalCommandArgs:
        - "-vv"
  # boto3 >=1.36 attaches x-amz-checksum headers Ceph/RadosGW rejects on MULTIPART uploads:
  # WAL (single-part) archives fine, the base backup (multipart) hangs forever. These env vars
  # revert to legacy checksum behavior. Runs in the barman plugin sidecar. (EDB/barman#1057)
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
---
# Encrypted-at-rest archive on Cloudflare R2 (every object AES-256 at rest, free egress).
# Hetzner Object Storage supports only SSE-C, which barman cannot use, so the Hetzner store
# above is now the RESTORE-FROM lineage only; new base backups and WAL land here.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: newapi-pg-r2
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://unorouter-backups/
    endpointURL: https://7dad953fa57f079bfec11d3db10bc18a.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId:
        name: newapi-pg-r2
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: newapi-pg-r2
        key: ACCESS_SECRET_KEY
      region:
        name: newapi-pg-r2
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: newapi-pg
  namespace: databases
  annotations:
    # A resource-level Prune option overrides the Application's prune policy. Without it, a
    # manifest that briefly leaves this app's scope (an ownership move, a bad path) is a
    # DELETED database. Removing this is a decision, not a cleanup.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  # Velero must NOT file-copy pgdata. CNPG's base backup + WAL archive (the -v4 prefix in
  # the same bucket) is the real restore path; a file-level copy of a running data
  # directory is only crash-consistent and would never be restored from. It was also 62GB
  # of the 98GB bucket, backing up the same bytes twice.
  inheritedMetadata:
    annotations:
      backup.velero.io/backup-volumes-excludes: pgdata,scratch-data,shm
  imageName: ghcr.io/cloudnative-pg/postgresql:15-standard-bookworm
  instances: 3
  # 2026-09-02: five primary moves in 40 minutes. Four were manual promotes, but
  # the reason they were being made is that node1 (4 cores, also etcd leader,
  # Prometheus, ArgoCD) saturates within 90s of hosting the primary, and with no
  # CPU request postgres carries the kernel-minimum CFS weight there, so it is the
  # first thing starved. A request fixes the weight; there is deliberately still no
  # limit (a cap makes postgres thrash, see the runbook's memory posture).
  resources:
    requests:
      memory: 1Gi
      cpu: 1000m
  # A readiness blip of a few seconds used to become a full failover immediately
  # (failoverDelay 0) and cost the app ~2 minutes of no-route-to-host. Waiting 30s
  # lets a transient recover; a real crash still fails over.
  failoverDelay: 30
  probes:
    readiness:
      # 5s was the default; under load the instance manager's own check can take
      # longer than that without postgres being unhealthy.
      timeoutSeconds: 10
  # Surfaces the new-api audit trail (logs.ip, admin actions, key reveals, 2FA churn) as
  # Prometheus series so the security alerts in infra rules-security.yaml can fire. Added
  # after the 2026-08-26 takeover, which was fully recorded in `logs` and alerted on by
  # nothing. Queries live in infra/monitoring/extras/cnpg-security-queries.yaml; they are
  # all bounded by created_at so they use idx_created_at_type instead of scanning 9M rows.
  monitoring:
    # false because monitoring/cnpg-instances already scrapes every pod carrying
    # cnpg.io/podRole=instance in this namespace. Enabling this too created a second
    # PodMonitor over the same three pods, so every series existed 6 times (3 instances
    # x 2 jobs): each `> 0` alert paged six times per event, and ElevatedAdminActivity's
    # sum() threshold of 800 actually tripped at ~133 real actions.
    enablePodMonitor: false
    customQueriesConfigMap:
      - name: cnpg-default-monitoring
        key: queries
      - name: cnpg-newapi-security
        key: queries
  # barman-cloud-backup runs in the postgres container -> the boto3 checksum-disable env must
  # be HERE (not just instanceSidecarConfiguration). Fixes the Hetzner Ceph multipart hang.
  env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required
  storage:
    size: 20Gi
    storageClass: local-path

  # DR MODE: recovery is create-time-only (inert on a running cluster). Every fresh create
  # RESTORES from S3 latest; add recoveryTarget.targetTime for PITR. On each DR event bump
  # the lineage PAIR below: restore-from = last archive, archive-to = +1.
  bootstrap:
    recovery:
      source: newapi-pg-origin
  externalClusters:
    - name: newapi-pg-origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: newapi-pg-store
          serverName: newapi-pg-v4 # RESTORE-FROM lineage (last Hetzner archive; R2 v5 after its first base backup)

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: newapi-pg-r2
        serverName: newapi-pg-v5 # ARCHIVE-TO lineage (current+1); MUST differ from restore-from

  # Teleport-provisioned read role, declared here so CNPG reconciles it on every DR.
  managed:
    roles:
      - name: reader
        login: true
        # inRoles is deliberately EMPTY. This role previously held pg_read_all_data on the
        # theory that an RLS policy on `options` was enough to hide secrets. It was not:
        # pg_read_all_data also reads users.password, users.access_token, tokens.key and
        # the TOTP seeds in two_fas, none of which RLS covers. Measured on 2026-08-27 that
        # was 3,908 access tokens, 27,962 API keys, 17,273 password hashes and 43 TOTP
        # seeds readable by a GitHub readonly-team member through Teleport, with no trace
        # in the application logs.
        #
        # The replacement is databases/reader-least-privilege.sql in the infra repo, which
        # grants column-scoped SELECT and withholds every secret column. That script must
        # be re-applied after any bootstrap that recreates the database.
        #
        # CNPG reconciles this block continuously, so re-adding pg_read_all_data here
        # silently re-grants it cluster-wide within a minute. A manual REVOKE cannot hold
        # against it: one was applied on 2026-08-27 and was gone by 2026-08-31.
        passwordSecret:
          name: newapi-pg-reader
        inRoles: []

  # Teleport DB access: reader authenticates with a Teleport-signed client cert (CN=reader).
  # clientCASecret ca.crt = own 10y CA (first, holds ca.key -> operator signs streaming_replica
  # from it) + Teleport db-client CA appended. Server certs stay operator-managed.
  certificates:
    clientCASecret: newapi-pg-client-ca

  postgresql:
    # cert rule lands AFTER CNPG's fixed streaming_replica rules, BEFORE the scram catch-all
    pg_hba:
      - hostssl newapi reader all cert
    parameters:
      max_connections: "200"
      # 3.3GB model_status_pings + 2.3M logs: default 128MB shared_buffers thrashed disk
      # on every status-page aggregation (83 SLOW SQL / 2h, user-visible page hangs)
      shared_buffers: "512MB"
      work_mem: "12MB"
      effective_cache_size: "3GB"
      # logs (11M rows, 18 indexes) never reached the default 20% dead-tuple trigger; per-table
      # scale factors live on the table (see infra bootstrap/dr/README.md), these make the runs fast and visible.
      autovacuum_vacuum_cost_limit: "1000"
      autovacuum_naptime: "30s"
      log_autovacuum_min_duration: "60s"
      # 2026-09-06: the Creem key leaked out of `options` by an unknown path and nothing
      # on the DB side could say who read it. Connection lines plus pgaudit object logging
      # on `options` (role auditor, see infra/infra/databases/options-audit.sql) give the
      # who/when next time; pgaudit.log stays none so only the audited table is logged.
      log_connections: "on"
      log_disconnections: "on"
      pgaudit.log: "none"
      pgaudit.role: "auditor"
      pgaudit.log_parameter: "off"
      # statement text off: a hand-typed UPDATE would put the new secret into the pod log
      # (the app's own writes are parameterised). relation on so the table name survives.
      pgaudit.log_statement: "off"
      pgaudit.log_relation: "on"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  annotations:
    # without this the CR is prunable: an ownership move deleted it once, which reset
    # lastScheduleTime and dropped the Backup CR the freshness alert reads.
    argocd.argoproj.io/sync-options: Prune=false
  name: newapi-pg-daily
  namespace: databases
spec:
  # daily base backup; continuous WAL archiving (plugin) gives PITR between base backups.
  schedule: "0 0 3 * * *" # 03:00 UTC daily (CNPG cron = 6 fields, leading seconds)
  backupOwnerReference: self
  cluster:
    name: newapi-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
