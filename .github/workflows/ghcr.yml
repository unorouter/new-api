name: GHCR Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    # A pin-only commit (build-local.sh or this workflow) must not rebuild the
    # same tree and roll the pods a second time, and neither must a manifest
    # edit: ArgoCD applies k8s/ on its own, a rebuild only rolls the gateway.
    paths-ignore:
      - k8s/**

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One NATIVE runner per arch (no QEMU): the frontend `bun run build` + apt stage ran
  # emulated on a single amd64 runner before = 22min. Native arm64 (ubuntu-24.04-arm) runs
  # its leg at full speed, in parallel with amd64. Each pushes by DIGEST only (no tag);
  # the manifest job stitches the multi-arch tag.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/unorouter/new-api,push-by-digest=true,name-canonical=true,push=true
          # Per-arch cache scope so the amd64 and arm64 GHA caches never overwrite.
          cache-from: type=gha,scope=new-api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=new-api-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Stitch the two per-arch digests into one multi-arch manifest under the real tags.
  manifest:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create + push manifest list
        id: manifest
        run: |
          IMAGE=ghcr.io/unorouter/new-api
          REFS=""
          for f in /tmp/digests/*; do REFS="$REFS $IMAGE@$(cat "$f")"; done
          for TAG in latest ${{ github.sha }}; do
            docker buildx imagetools create -t "$IMAGE:$TAG" $REFS
          done
          docker buildx imagetools inspect "$IMAGE:${{ github.sha }}"
          D=$(docker buildx imagetools inspect "$IMAGE:${{ github.sha }}" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$D" == sha256:* ]] || { echo "::error::no manifest digest for $IMAGE:${{ github.sha }}"; exit 1; }
          echo "digest=$D" >> "$GITHUB_OUTPUT"

  # Pin the new image in this repo's own k8s/ manifests. ArgoCD discovers this repo by its
  # k8s/ directory and rolls the Deployment out, so nothing here talks to the cluster and no
  # cross-repo token is needed -- the built-in GITHUB_TOKEN is enough.
  #
  # The tag is the git SHA, never :latest -- with a floating tag the manifest never changes,
  # ArgoCD sees nothing to do, and the deploy silently never happens.
  deploy:
    runs-on: ubuntu-latest
    needs: manifest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Pin new-api image to this commit
        run: |
          set -euo pipefail
          F=k8s/deployment.yaml
          OLD=$(grep -oP 'image: ghcr\.io/unorouter/new-api:\K\S+' "$F" | head -1)
          # tag for people, digest for the cluster: a re-pushed tag cannot change what runs
          NEW="${{ github.sha }}@${{ needs.manifest.outputs.digest }}"
          if [ "$OLD" = "$NEW" ]; then
            echo "already pinned to $NEW, nothing to do"
            exit 0
          fi
          # master AND slave share the image, so replace every occurrence
          sed -i "s|image: ghcr.io/unorouter/new-api:.*|image: ghcr.io/unorouter/new-api:$NEW|g" "$F"
          git config user.name  "unorouter-ci"
          git config user.email "ci@unorouter.com"
          git add "$F"
          git commit -m "deploy(new-api): ${{ github.sha }}

          Was: $OLD"
          # main can move between checkout and push (a concurrent push, or a human commit)
          for i in 1 2 3; do
            git push origin main && exit 0
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase origin main
          done
          echo "::error::could not push image pin after 3 attempts"
          exit 1
