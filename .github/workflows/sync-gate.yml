name: Sync Gate

# Prod pushes straight to main and never opens a PR, so upstream's ci.yml never
# runs for us. An upstream sync lands on sync/<date> first: nothing builds or
# pins from that branch, and main only moves once every job here is green.
on:
  workflow_dispatch:
  push:
    branches: ['sync/**']

permissions:
  contents: read

concurrency:
  group: sync-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go vet, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Frontend embed placeholder
        run: mkdir -p web/dist && touch web/dist/index.html
      - run: scripts/sync-audit.sh
      - run: go vet ./...
      - run: go vet ./...
        working-directory: relaykit
      - run: make test

  frontend:
    name: Frontend typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  boot:
    name: Image builds and master boots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: new-api:sync-gate
          # read the deploy cache, never write it: a sync branch must not evict main's layers
          cache-from: type=gha,scope=new-api-amd64
      - run: scripts/boot-smoke.sh image new-api:sync-gate

  relay:
    name: Same requests, main versus this branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build both binaries
        run: |
          mkdir -p web/dist && touch web/dist/index.html
          go build -o /tmp/new-api-branch .
          git worktree add --detach /tmp/main-tree origin/main
          mkdir -p /tmp/main-tree/web/dist && touch /tmp/main-tree/web/dist/index.html
          (cd /tmp/main-tree && go build -o /tmp/new-api-main .)
      - run: scripts/relay-smoke.sh compare /tmp/new-api-main /tmp/new-api-branch
